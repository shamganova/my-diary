<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- The app icon: a blue heart coloured in with a marker, on a lined notepad.
       icon-180.png, icon-192.png and icon-512.png are pictures of this file.
       The square has no rounded corners: the iPad rounds them itself. -->
  <defs>
    <clipPath id="sheet"><path d="M0 0 H100 V65.6 L73.6 92 H22 A22 22 0 0 1 0 70 Z"/></clipPath>
    <clipPath id="heart"><path d="M50 72 C34 61 25 51 25 41 C25 33 31 27 38 27 C43.5 27 47.5 30 50 35 C52.5 30 56.5 27 62 27 C69 27 75 33 75 41 C75 51 66 61 50 72 Z"/></clipPath>
  </defs>

  <!-- Pages under the top page -->
  <rect width="100" height="100" fill="#E5E3DC"/>
  <path d="M0 0 H100 V74 A22 22 0 0 1 78 96 H22 A22 22 0 0 1 0 74 Z" fill="#F1EFE8"/>
  <path d="M0 74 A22 22 0 0 0 22 96 H78 A22 22 0 0 0 100 74" fill="none" stroke="#D3D1C7" stroke-width="0.8"/>

  <!-- The top page with lines and a folded corner -->
  <path d="M0 0 H100 V65.6 L73.6 92 H22 A22 22 0 0 1 0 70 Z" fill="#FFFFFF"/>
  <g clip-path="url(#sheet)" stroke="#D3D1C7" stroke-width="1.5">
    <path d="M0 23 H100 M0 34.5 H100 M0 46 H100 M0 57.5 H100 M0 69 H100 M0 80.5 H100"/>
  </g>
  <path d="M0 70 A22 22 0 0 0 22 92 H73.6 L100 65.6" fill="none" stroke="#D3D1C7" stroke-width="0.8"/>
  <path d="M100 65.6 C92.8 71.6 86.8 74 80.8 75.2 C79.6 81.2 77.2 87.2 73.6 92 Z" fill="#F1EFE8" stroke="#D3D1C7"
        stroke-width="0.8" stroke-linejoin="round"/>

  <!-- The heart: light blue, marker strokes, blue outline -->
  <g transform="translate(50 47) scale(1.14) translate(-50 -49.5)">
    <path d="M50 72 C34 61 25 51 25 41 C25 33 31 27 38 27 C43.5 27 47.5 30 50 35 C52.5 30 56.5 27 62 27 C69 27 75 33 75 41 C75 51 66 61 50 72 Z" fill="#B5D4F4"/>
    <g clip-path="url(#heart)">
      <path d="M22 34 L44 26 L24 44 L62 26 L26 54 L76 30 L34 62 L78 40 L44 70 L76 50 L52 74" fill="none" stroke="#85B7EB"
            stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <path d="M50 72 C34 61 25 51 25 41 C25 33 31 27 38 27 C43.5 27 47.5 30 50 35 C52.5 30 56.5 27 62 27 C69 27 75 33 75 41 C75 51 66 61 50 72 Z"
          fill="none" stroke="#378ADD" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
</svg>
